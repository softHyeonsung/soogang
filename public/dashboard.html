<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수강신청 - 대시보드</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Layout: 상단 강좌 목록 + 하단 고정 내 수강목록 ── */
    body.app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .dashboard-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 1.5rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }

    /* ── 강좌 목록 (스크롤 가능 영역) ── */
    .courses-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* ── 강좌 한 줄 테이블 ── */
    .course-table-wrap {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .course-table-wrap table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
    }

    .course-table-wrap th {
      background: #f1f5f9;
      padding: 1rem 1.25rem;
      text-align: left;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    .course-table-wrap td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 1rem;
      vertical-align: middle;
    }

    .course-table-wrap tr:last-child td { border-bottom: none; }
    .course-table-wrap tr:hover td { background: #f8fafc; }
    .course-table-wrap tr.enrolled td { background: #f0fdf4; }
    .course-table-wrap tr.enrolled:hover td { background: #dcfce7; }

    .course-name-cell { font-size: 1.05rem; font-weight: 700; color: var(--text); }
    .course-desc-cell { font-size: .9rem; color: var(--text-muted); margin-top: .2rem; }

    .cap-wrap { min-width: 130px; }
    .cap-bar { height: 6px; background: var(--border); border-radius: 99px; margin-bottom: .3rem; }
    .cap-fill { height: 100%; border-radius: 99px; background: var(--primary); }
    .cap-fill.full { background: var(--danger); }
    .cap-text { font-size: .9rem; color: var(--text-muted); white-space: nowrap; }

    .action-cell { width: 120px; }
    .action-cell .btn { width: 110px; font-size: .95rem; padding: .55rem .8rem; }

    /* ── 하단 고정 내 수강목록 ── */
    .my-panel {
      flex-shrink: 0;
      margin-top: 1rem;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 1.5px solid var(--primary);
    }

    .my-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .9rem 1.25rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }

    .my-panel-header h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
    }

    .my-panel-toggle {
      font-size: .85rem;
      color: var(--text-muted);
    }

    .my-panel-body {
      overflow-y: auto;
      max-height: 220px;
    }

    .my-panel-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
    }

    .my-panel-body th {
      background: #f8fafc;
      padding: .75rem 1.25rem;
      text-align: left;
      font-size: .95rem;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
    }

    .my-panel-body td {
      padding: .8rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 1rem;
    }

    .my-panel-body tr:last-child td { border-bottom: none; }
    .my-panel-empty { padding: 1.2rem 1.25rem; color: var(--text-muted); font-size: .95rem; }

    /* ── 상단 헤더 ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .section-header h2 { font-size: 1.4rem; font-weight: 800; }
    .section-header p { font-size: .95rem; color: var(--text-muted); margin-top: .15rem; }

    .enrolled-badge {
      display: inline-block;
      padding: .15rem .6rem;
      background: var(--success-light);
      color: var(--success);
      border-radius: 99px;
      font-size: .8rem;
      font-weight: 700;
      margin-left: .5rem;
    }

    @media (max-width: 640px) {
      .dashboard-body { padding: .75rem; }
      .section-header h2 { font-size: 1.2rem; }

      /* 강좌 테이블 → 카드 레이아웃 */
      .course-table-wrap { border: none; box-shadow: none; background: transparent; overflow: visible; }
      .course-table-wrap table,
      .course-table-wrap tbody,
      .course-table-wrap tr,
      .course-table-wrap td { display: block; width: 100%; box-sizing: border-box; }
      .course-table-wrap thead { display: none; }
      .course-table-wrap tr {
        border: 1.5px solid var(--border);
        border-radius: 10px;
        margin-bottom: .6rem;
        padding: .85rem 1rem;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .course-table-wrap tr.enrolled { border-color: var(--primary); background: #fafffe; }
      .course-table-wrap tr:hover td { background: transparent; }
      .course-table-wrap tr.enrolled:hover td { background: transparent; }
      .course-table-wrap td { padding: .15rem 0; border-bottom: none; white-space: normal; font-size: .95rem; }
      .cap-wrap { min-width: unset; margin-top: .35rem; }
      .action-cell { width: 100%; margin-top: .6rem; }
      .action-cell .btn { width: 100%; }

      /* 내 수강목록 패널 */
      .my-panel-body { overflow-x: auto; }
      .my-panel-body th, .my-panel-body td { padding: .6rem .85rem; font-size: .9rem; }
    }
  </style>
</head>
<body class="app">
  <nav class="navbar">
    <span class="navbar-brand">수강신청 시스템</span>
    <div class="navbar-user">
      <span id="userName"></span>
      <span class="badge">학생</span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">로그아웃</button>
    </div>
  </nav>

  <div class="dashboard-body">
    <!-- 강좌 목록 -->
    <div class="section-header">
      <div>
        <h2>수강신청</h2>
        <p>원하는 강좌를 신청하세요</p>
      </div>
    </div>

    <div id="regBanner" style="display:none;padding:.75rem 1rem;border-radius:8px;margin-bottom:.75rem;font-size:.93rem;font-weight:600"></div>

    <div class="courses-area">
      <div class="course-table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:30%">강좌명</th>
              <th style="width:13%">담당교수</th>
              <th style="width:18%">강의시간</th>
              <th style="width:20%">수강인원</th>
              <th style="width:19%" class="action-cell">신청</th>
            </tr>
          </thead>
          <tbody id="courseBody">
            <tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-muted)">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 내 수강목록 (하단 고정) -->
    <div class="my-panel">
      <div class="my-panel-header" onclick="toggleMyPanel()">
        <h3>내 수강 목록 <span id="myCount" class="enrolled-badge">0</span></h3>
        <span class="my-panel-toggle" id="panelToggleIcon">▲ 접기</span>
      </div>
      <div class="my-panel-body" id="myPanelBody">
        <div class="my-panel-empty">신청한 강좌가 없습니다.</div>
      </div>
    </div>
  </div>

  <!-- 강좌 세부 모달 -->
  <div class="modal-overlay" id="detailModal" onclick="if(event.target===this)closeDetail()">
    <div class="modal" style="max-width:440px">
      <div class="modal-header">
        <h3 id="detailName" style="font-size:1.15rem;font-weight:800;line-height:1.3;padding-right:.5rem"></h3>
        <button class="modal-close" onclick="closeDetail()">×</button>
      </div>
      <div id="detailDesc" style="font-size:.92rem;color:var(--text-muted);margin-bottom:1.1rem;line-height:1.65;display:none"></div>
      <div id="detailMeta" style="display:flex;flex-direction:column;gap:.7rem;font-size:.95rem;margin-bottom:1.25rem;padding:.9rem 1rem;background:var(--bg);border-radius:8px"></div>
      <div style="margin-bottom:1.25rem">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.35rem">
          <span style="font-size:.85rem;font-weight:600;color:var(--text-muted)">수강인원</span>
          <span id="detailCapText" style="font-size:.88rem;color:var(--text-muted)"></span>
        </div>
        <div class="cap-bar"><div id="detailCapFill" class="cap-fill" style="width:0%"></div></div>
        <div id="detailGenderCap" style="font-size:.85rem;margin-top:.4rem;display:flex;gap:.75rem"></div>
      </div>
      <div id="detailAction"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let panelOpen = true;
    let regOpen = true;
    let courseList = [];

    async function init() {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/'; return; }
      const user = await res.json();
      if (user.role === 'admin') { window.location.href = '/admin.html'; return; }
      document.getElementById('userName').textContent = user.name + '님';

      // 수강신청 기간 확인
      try {
        const rr = await fetch('/api/settings/registration');
        const reg = await rr.json();
        applyRegPeriod(reg);
      } catch {}

      loadCourses();
      loadMyList();
    }

    function applyRegPeriod(reg) {
      const banner = document.getElementById('regBanner');
      if (!reg.enabled) { regOpen = true; banner.style.display = 'none'; return; }

      const now   = new Date();
      const start = reg.start ? new Date(reg.start) : null;
      const end   = reg.end   ? new Date(reg.end)   : null;

      if (start && now < start) {
        regOpen = false;
        showBanner(`수강신청 기간이 아닙니다. 시작: ${fmtDateTime(reg.start)}`, '#fef9c3', '#854d0e');
      } else if (end && now > end) {
        regOpen = false;
        showBanner(`수강신청이 종료되었습니다. (종료: ${fmtDateTime(reg.end)})`, '#fee2e2', '#991b1b');
      } else {
        regOpen = true;
        if (end) showBanner(`수강신청 진행 중 · 마감: ${fmtDateTime(reg.end)}`, '#dcfce7', '#166534');
      }
    }

    function showBanner(msg, bg, color) {
      const b = document.getElementById('regBanner');
      b.textContent = msg;
      b.style.cssText = `display:block;padding:.75rem 1rem;border-radius:8px;margin-bottom:.75rem;font-size:.93rem;font-weight:600;background:${bg};color:${color}`;
    }

    async function loadCourses() {
      const res = await fetch('/api/courses');
      courseList = await res.json();
      const tbody = document.getElementById('courseBody');

      if (!courseList.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2.5rem;color:var(--text-muted);font-size:1rem">등록된 강좌가 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = courseList.map(c => {
        const pct = Math.min(100, Math.round((c.enrolled_count / c.capacity) * 100));
        const full = c.enrolled_count >= c.capacity || c.gender_full;
        const enrolled = c.is_enrolled > 0;
        const btn = enrolled
          ? `<button class="btn btn-outline" onclick="unenroll(${c.id})">수강 취소</button>`
          : !regOpen
            ? `<button class="btn btn-ghost" disabled>신청 불가</button>`
            : full
              ? `<button class="btn btn-ghost" disabled>정원 마감</button>`
              : `<button class="btn btn-primary" onclick="enroll(${c.id})">수강 신청</button>`;
        return `<tr class="${enrolled ? 'enrolled' : ''}" style="cursor:pointer" onclick="showDetail(${c.id})">
          <td class="wrap">
            <div class="course-name-cell">${esc(c.name)}</div>
            ${c.description ? `<div class="course-desc-cell">${esc(c.description)}</div>` : ''}
          </td>
          <td style="font-size:1rem">${esc(c.instructor || '-')}</td>
          <td style="font-size:1rem">${c.days && c.start_time ? `${esc(c.days)} ${esc(c.start_time)}~${esc(c.end_time)}` : esc(c.schedule || '-')}</td>
          <td class="cap-wrap">
            <div class="cap-bar"><div class="cap-fill ${full ? 'full' : ''}" style="width:${pct}%"></div></div>
            <span class="cap-text">${c.enrolled_count} / ${c.capacity} 명</span>
            ${(c.capacity_male > 0 || c.capacity_female > 0) ? `
            <div style="font-size:.82rem;margin-top:.3rem;display:flex;gap:.5rem;flex-wrap:wrap">
              ${c.capacity_male > 0 ? `<span style="color:#2563eb">남 ${c.enrolled_male}/${c.capacity_male}</span>` : ''}
              ${c.capacity_female > 0 ? `<span style="color:#db2777">여 ${c.enrolled_female}/${c.capacity_female}</span>` : ''}
            </div>` : ''}
          </td>
          <td class="action-cell" onclick="event.stopPropagation()">${btn}</td>
        </tr>`;
      }).join('');
    }

    function showDetail(id) {
      const c = courseList.find(x => x.id === id);
      if (!c) return;

      document.getElementById('detailName').textContent = c.name;

      const descEl = document.getElementById('detailDesc');
      if (c.description) { descEl.textContent = c.description; descEl.style.display = ''; }
      else { descEl.style.display = 'none'; }

      const rows = [];
      if (c.instructor) rows.push(`<div style="display:flex;gap:.5rem"><span style="color:var(--text-muted);min-width:4.5rem;font-size:.88rem">담당교수</span><strong>${esc(c.instructor)}</strong></div>`);
      const time = c.days && c.start_time ? `${esc(c.days)} ${esc(c.start_time)} ~ ${esc(c.end_time)}` : '';
      if (time) rows.push(`<div style="display:flex;gap:.5rem"><span style="color:var(--text-muted);min-width:4.5rem;font-size:.88rem">강의시간</span><strong>${time}</strong></div>`);
      if (c.schedule) rows.push(`<div style="display:flex;gap:.5rem"><span style="color:var(--text-muted);min-width:4.5rem;font-size:.88rem">강의실</span><strong>${esc(c.schedule)}</strong></div>`);
      document.getElementById('detailMeta').innerHTML = rows.length ? rows.join('') : '<span style="color:var(--text-muted);font-size:.9rem">세부 정보 없음</span>';

      const pct = Math.min(100, Math.round((c.enrolled_count / c.capacity) * 100));
      const full = c.enrolled_count >= c.capacity || c.gender_full;
      document.getElementById('detailCapText').textContent = `${c.enrolled_count} / ${c.capacity} 명`;
      const fill = document.getElementById('detailCapFill');
      fill.style.width = pct + '%';
      fill.className = 'cap-fill' + (full ? ' full' : '');
      const genderEl = document.getElementById('detailGenderCap');
      genderEl.innerHTML = (c.capacity_male > 0 || c.capacity_female > 0)
        ? `${c.capacity_male > 0 ? `<span style="color:#2563eb">남 ${c.enrolled_male}/${c.capacity_male}</span>` : ''}
           ${c.capacity_female > 0 ? `<span style="color:#db2777">여 ${c.enrolled_female}/${c.capacity_female}</span>` : ''}` : '';

      const enrolled = c.is_enrolled > 0;
      document.getElementById('detailAction').innerHTML = enrolled
        ? `<button class="btn btn-outline w-full" onclick="unenrollFromDetail(${c.id})">수강 취소</button>`
        : !regOpen
          ? `<button class="btn btn-ghost w-full" disabled>신청 불가</button>`
          : full
            ? `<button class="btn btn-ghost w-full" disabled>정원 마감</button>`
            : `<button class="btn btn-primary w-full" onclick="enrollFromDetail(${c.id})">수강 신청</button>`;

      document.getElementById('detailModal').classList.add('open');
    }

    function closeDetail() {
      document.getElementById('detailModal').classList.remove('open');
    }

    async function enrollFromDetail(id) {
      const res = await fetch(`/api/courses/${id}/enroll`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('수강 신청되었습니다!', 'success');
      closeDetail();
      loadCourses(); loadMyList();
    }

    async function unenrollFromDetail(id) {
      if (!confirm('수강 신청을 취소하시겠습니까?')) return;
      const res = await fetch(`/api/courses/${id}/enroll`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('수강이 취소되었습니다.', 'success');
      closeDetail();
      loadCourses(); loadMyList();
    }

    async function loadMyList() {
      const res = await fetch('/api/my-enrollments');
      const list = await res.json();
      const el = document.getElementById('myPanelBody');
      document.getElementById('myCount').textContent = list.length;

      if (!list.length) {
        el.innerHTML = '<div class="my-panel-empty">신청한 강좌가 없습니다.</div>';
        return;
      }

      el.innerHTML = `<table>
        <thead><tr>
          <th style="width:30%">강좌명</th>
          <th style="width:15%">담당교수</th>
          <th style="width:20%">강의시간</th>
          <th style="width:15%">장소</th>
          <th style="width:20%">신청일</th>
        </tr></thead>
        <tbody>${list.map(c => `<tr>
          <td><strong>${esc(c.name)}</strong></td>
          <td>${esc(c.instructor || '-')}</td>
          <td>${c.days && c.start_time ? `${esc(c.days)} ${esc(c.start_time)}~${esc(c.end_time)}` : '-'}</td>
          <td>${esc(c.schedule || '-')}</td>
          <td>${fmtDate(c.enrolled_at)}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    function toggleMyPanel() {
      panelOpen = !panelOpen;
      document.getElementById('myPanelBody').style.display = panelOpen ? '' : 'none';
      document.getElementById('panelToggleIcon').textContent = panelOpen ? '▼ 접기' : '▲ 펼치기';
    }

    async function enroll(id) {
      const res = await fetch(`/api/courses/${id}/enroll`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('수강 신청되었습니다!', 'success');
      loadCourses(); loadMyList();
    }

    async function unenroll(id) {
      if (!confirm('수강 신청을 취소하시겠습니까?')) return;
      const res = await fetch(`/api/courses/${id}/enroll`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('수강이 취소되었습니다.', 'success');
      loadCourses(); loadMyList();
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    }

    function esc(str) {
      return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function fmtDate(d) {
      return d ? new Date(d).toLocaleDateString('ko-KR') : '-';
    }
    function fmtDateTime(d) {
      if (!d) return '-';
      return new Date(d).toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12: false });
    }
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show' + (type ? ' ' + type : '');
      setTimeout(() => t.className = 'toast', 2500);
    }

    init();
  </script>
</body>
</html>
