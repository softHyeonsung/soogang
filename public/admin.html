<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수강신청 - 관리자</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Admin course card grid ── */
    .admin-course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    .admin-course-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border);
      padding: 1.1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: .55rem;
      transition: box-shadow .2s, border-color .2s;
    }
    .admin-course-card:hover { box-shadow: var(--shadow-md); border-color: #c7d2fe; }
    .admin-course-card.dragging { opacity: .35; }
    .admin-course-card.drag-over { border-color: var(--primary); border-style: dashed; background: var(--primary-light); }
    .acc-header { display: flex; align-items: flex-start; gap: .5rem; }
    .acc-drag { cursor: grab; color: var(--text-muted); font-size: 1.1rem; user-select: none; padding-top: .1rem; flex-shrink: 0; }
    .acc-drag:active { cursor: grabbing; }
    .acc-name { font-size: 1rem; font-weight: 700; flex: 1; line-height: 1.4; }
    .acc-desc { font-size: .82rem; color: #475569; line-height: 1.55; }
    .acc-meta { display: flex; flex-direction: column; gap: .25rem; font-size: .82rem; color: var(--text-muted); }
    .acc-meta span { display: flex; align-items: center; gap: .3rem; }
    .acc-cap-bar { height: 5px; background: var(--border); border-radius: 99px; }
    .acc-cap-fill { height: 100%; border-radius: 99px; background: var(--primary); transition: width .3s; }
    .acc-cap-fill.full { background: var(--danger); }
    .acc-cap-row { display: flex; justify-content: space-between; align-items: center; margin-top: .3rem; font-size: .81rem; }
    .acc-actions { display: flex; gap: .4rem; margin-top: .1rem; flex-wrap: wrap; }

    @media (max-width: 640px) {
      .main-content { padding: .75rem; }
      .page-header { margin-bottom: 1rem; }
      .page-header h2 { font-size: 1.2rem; }
      .modal { max-height: 90vh; overflow-y: auto; }
      .admin-course-grid { grid-template-columns: 1fr; }
      .table-wrap { -webkit-overflow-scrolling: touch; }
      th, td { font-size: .82rem; padding: .6rem .75rem; }
      /* 기간 설정: 모바일에서 꽉 채우기 */
      #tabSettings > div { max-width: 100% !important; }
    }
  </style>
</head>
<body class="app">
  <nav class="navbar">
    <span class="navbar-brand">송중침 청년교구<br>계절학기 수강신청</span>
    <div class="navbar-user">
      <span id="adminName"></span>
      <span class="badge badge-admin">관리자</span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">로그아웃</button>
    </div>
  </nav>

  <div class="main-content">
    <div class="page-header">
      <h2>관리자 패널</h2>
      <p>강좌 및 회원을 관리합니다</p>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchTab('courses')">강좌 관리</button>
      <button class="admin-tab" onclick="switchTab('users')">회원 관리</button>
      <button class="admin-tab" onclick="switchTab('settings')">기간 설정</button>
    </div>

    <!-- Courses Tab -->
    <div id="tabCourses">
      <div class="flex items-center justify-between mb-2">
        <span style="font-weight:700;font-size:.95rem;white-space:nowrap" id="courseCount"></span>
        <button class="btn btn-primary" onclick="openCourseModal()" style="padding:.35rem .75rem;font-size:.82rem;width:auto;white-space:nowrap;flex-shrink:0">+ 추가</button>
      </div>
      <div id="courseTable"></div>
    </div>

    <!-- Users Tab -->
    <div id="tabUsers" style="display:none">
      <div class="mb-2" style="font-weight:700;font-size:.95rem" id="userCount"></div>
      <div id="userTable"></div>
    </div>

    <!-- Settings Tab -->
    <div id="tabSettings" style="display:none">
      <div style="max-width:360px;margin:0 auto">
        <div id="regStatusBanner" style="display:none;padding:.65rem .9rem;border-radius:8px;margin-bottom:1rem;font-size:.88rem;font-weight:600"></div>
        <div style="background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:1.25rem">
          <h3 style="font-size:.95rem;font-weight:700;margin-bottom:1rem">수강신청 기간 설정</h3>
          <div id="settingsError" class="error-msg"></div>
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;width:fit-content">
              <input type="checkbox" id="regEnabled" style="width:15px;height:15px;accent-color:var(--primary)">
              <span style="font-weight:600;font-size:.88rem">기간 제한 활성화</span>
            </label>
            <div class="hint" style="margin-top:.35rem">활성화하면 아래 기간 외에는 수강신청이 불가합니다.</div>
          </div>
          <div class="form-group">
            <label>신청 시작</label>
            <div style="display:flex;gap:.5rem">
              <input type="date" id="regStartDate" style="flex:1;min-width:0;padding:.5rem .6rem;border:1.5px solid var(--border);border-radius:8px;font-size:1rem;box-sizing:border-box">
              <input type="time" id="regStartTime" step="300" style="width:100px;flex-shrink:0;padding:.5rem .6rem;border:1.5px solid var(--border);border-radius:8px;font-size:1rem;box-sizing:border-box">
            </div>
          </div>
          <div class="form-group">
            <label>신청 종료</label>
            <div style="display:flex;gap:.5rem">
              <input type="date" id="regEndDate" style="flex:1;min-width:0;padding:.5rem .6rem;border:1.5px solid var(--border);border-radius:8px;font-size:1rem;box-sizing:border-box">
              <input type="time" id="regEndTime" step="300" style="width:100px;flex-shrink:0;padding:.5rem .6rem;border:1.5px solid var(--border);border-radius:8px;font-size:1rem;box-sizing:border-box">
            </div>
          </div>
          <button class="btn btn-primary" onclick="saveSettings()" style="width:100%;margin-top:.4rem;padding:.55rem">저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Course Modal -->
  <div class="modal-overlay" id="courseModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="courseModalTitle">강좌 추가</h3>
        <button class="modal-close" onclick="closeModal('courseModal')">×</button>
      </div>
      <div id="courseModalError" class="error-msg"></div>
      <div class="form-group">
        <label>강좌명 *</label>
        <input type="text" id="cName" placeholder="예: 데이터구조론">
      </div>
      <div class="form-group">
        <label>담당 교수</label>
        <input type="text" id="cInstructor" placeholder="예: 김교수">
      </div>
      <div class="form-group">
        <label>요일</label>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.25rem">
          <label class="day-btn"><input type="checkbox" value="월"> 월</label>
          <label class="day-btn"><input type="checkbox" value="화"> 화</label>
          <label class="day-btn"><input type="checkbox" value="수"> 수</label>
          <label class="day-btn"><input type="checkbox" value="목"> 목</label>
          <label class="day-btn"><input type="checkbox" value="금"> 금</label>
          <label class="day-btn"><input type="checkbox" value="토"> 토</label>
          <label class="day-btn"><input type="checkbox" value="일"> 일</label>
        </div>
      </div>
      <div class="form-group" style="display:flex;gap:.75rem">
        <div style="flex:1">
          <label>시작시간</label>
          <input type="time" id="cStartTime" step="300" style="width:100%;padding:.6rem .75rem;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem">
        </div>
        <div style="flex:1">
          <label>종료시간</label>
          <input type="time" id="cEndTime" step="300" style="width:100%;padding:.6rem .75rem;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem">
        </div>
      </div>
      <div class="form-group">
        <label>강의실 / 비고</label>
        <input type="text" id="cSchedule" placeholder="예: 공학관 301호">
      </div>
      <div class="form-group">
        <label>정원 *</label>
        <input type="number" id="cCapacity" placeholder="30" min="1">
      </div>
      <div class="form-group">
        <label>성별 정원 <span style="font-weight:400;font-size:.82rem;color:var(--text-muted)">(0 또는 빈칸이면 제한 없음)</span></label>
        <div style="display:flex;gap:.75rem;margin-top:.25rem">
          <div style="flex:1">
            <label style="font-size:.85rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:.3rem">남자</label>
            <input type="number" id="cCapacityMale" placeholder="0" min="0" style="width:100%;padding:.6rem .75rem;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem;box-sizing:border-box">
          </div>
          <div style="flex:1">
            <label style="font-size:.85rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:.3rem">여자</label>
            <input type="number" id="cCapacityFemale" placeholder="0" min="0" style="width:100%;padding:.6rem .75rem;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem;box-sizing:border-box">
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>강좌 설명</label>
        <textarea id="cDesc" rows="3" placeholder="강좌에 대한 설명을 입력하세요"></textarea>
      </div>
      <div class="modal-footer" style="display:flex;gap:.75rem">
        <button class="btn btn-ghost" onclick="closeModal('courseModal')" style="flex:1;border:1.5px solid var(--border)">취소</button>
        <button class="btn btn-primary" onclick="saveCourse()" id="saveCourseBtn" style="flex:1">추가</button>
      </div>
    </div>
  </div>

  <!-- Enrollment Modal -->
  <div class="modal-overlay" id="enrollModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="enrollModalTitle">수강 신청자 목록</h3>
        <button class="modal-close" onclick="closeModal('enrollModal')">×</button>
      </div>
      <div style="display:flex;gap:.5rem;margin-bottom:.75rem;align-items:center">
        <span style="font-size:.85rem;color:var(--text-muted);flex-shrink:0">성별 필터:</span>
        <div style="display:flex;gap:.35rem" id="genderFilterBtns">
          <button class="btn btn-sm gender-filter-btn active" data-gender="전체" onclick="filterEnrollByGender('전체')">전체</button>
          <button class="btn btn-sm gender-filter-btn" data-gender="남" onclick="filterEnrollByGender('남')">남</button>
          <button class="btn btn-sm gender-filter-btn" data-gender="여" onclick="filterEnrollByGender('여')">여</button>
        </div>
        <span id="enrollFilterCount" style="font-size:.85rem;color:var(--text-muted);margin-left:auto"></span>
      </div>
      <div id="enrollList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let editingCourseId = null;

    async function init() {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/'; return; }
      const user = await res.json();
      if (user.role !== 'admin') { window.location.href = '/dashboard.html'; return; }
      document.getElementById('adminName').textContent = user.name + '님';
      loadCourses();
    }

    function switchTab(tab) {
      document.getElementById('tabCourses').style.display  = tab === 'courses'  ? '' : 'none';
      document.getElementById('tabUsers').style.display    = tab === 'users'    ? '' : 'none';
      document.getElementById('tabSettings').style.display = tab === 'settings' ? '' : 'none';
      const tabs = ['courses', 'users', 'settings'];
      document.querySelectorAll('.admin-tab').forEach((b, i) => b.classList.toggle('active', tabs[i] === tab));
      if (tab === 'courses') loadCourses();
      else if (tab === 'users') loadUsers();
      else loadSettings();
    }

    // ── Courses ──────────────────────────────────────────────────────────────
    async function loadCourses() {
      const res = await fetch('/api/admin/courses');
      const courses = await res.json();
      document.getElementById('courseCount').textContent = `전체 강좌 ${courses.length}개`;

      const el = document.getElementById('courseTable');
      if (!courses.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">📚</div><p>등록된 강좌가 없습니다.</p></div>';
        return;
      }

      el.innerHTML = `<div class="admin-course-grid">${courses.map(c => {
          const pct = Math.min(100, Math.round((c.enrolled_count / c.capacity) * 100));
          const full = c.enrolled_count >= c.capacity;
          const timeStr = c.days && c.start_time
            ? `${esc(c.days)} ${esc(c.start_time)}~${esc(c.end_time)}`
            : '';
          return `<div class="admin-course-card" draggable="true" data-id="${c.id}">
            <div class="acc-header">
              <span class="acc-drag" title="드래그하여 순서 변경">⠿</span>
              <span class="acc-name">${esc(c.name)}</span>
            </div>
            ${c.description ? `<div class="acc-desc">${esc(c.description)}</div>` : ''}
            <div class="acc-meta">
              ${c.instructor ? `<span>👤 ${esc(c.instructor)}</span>` : ''}
              ${timeStr ? `<span>🕐 ${timeStr}</span>` : ''}
              ${c.schedule ? `<span>📍 ${esc(c.schedule)}</span>` : ''}
            </div>
            <div>
              <div class="acc-cap-bar">
                <div class="acc-cap-fill${full ? ' full' : ''}" style="width:${pct}%"></div>
              </div>
              <div class="acc-cap-row">
                <span style="color:var(--text-muted)">${c.enrolled_count} / ${c.capacity}명</span>
                ${(c.capacity_male > 0 || c.capacity_female > 0) ? `
                <div style="display:flex;gap:.5rem">
                  ${c.capacity_male > 0 ? `<span style="color:#2563eb">남 ${c.enrolled_male}/${c.capacity_male}</span>` : ''}
                  ${c.capacity_female > 0 ? `<span style="color:#db2777">여 ${c.enrolled_female}/${c.capacity_female}</span>` : ''}
                </div>` : ''}
              </div>
            </div>
            <div class="acc-actions">
              <button class="btn btn-outline btn-sm js-show-enrollments" data-id="${c.id}" data-name="${esc(c.name)}">${c.enrolled_count}명 보기</button>
              <button class="btn btn-warning btn-sm js-edit-course" data-id="${c.id}">수정</button>
              <button class="btn btn-danger btn-sm js-delete-course" data-id="${c.id}" data-name="${esc(c.name)}">삭제</button>
            </div>
          </div>`;
        }).join('')}</div>`;

      attachDragHandlers(el.querySelector('.admin-course-grid'));
    }

    function openCourseModal(course = null) {
      editingCourseId = course ? course.id : null;
      document.getElementById('courseModalTitle').textContent = course ? '강좌 수정' : '강좌 추가';
      document.getElementById('saveCourseBtn').textContent = course ? '수정' : '추가';
      document.getElementById('cName').value = course?.name || '';
      document.getElementById('cInstructor').value = course?.instructor || '';
      document.getElementById('cSchedule').value = course?.schedule || '';
      document.getElementById('cStartTime').value = course?.start_time || '';
      document.getElementById('cEndTime').value = course?.end_time || '';
      document.getElementById('cCapacity').value = course?.capacity || '';
      document.getElementById('cCapacityMale').value = course?.capacity_male || '';
      document.getElementById('cCapacityFemale').value = course?.capacity_female || '';
      document.getElementById('cDesc').value = course?.description || '';
      // Set day checkboxes
      const selectedDays = [...(course?.days || '')];
      document.querySelectorAll('.day-btn input').forEach(cb => {
        cb.checked = selectedDays.includes(cb.value);
      });
      document.getElementById('courseModalError').style.display = 'none';
      openModal('courseModal');
    }

    async function editCourse(id) {
      const res = await fetch('/api/admin/courses');
      const courses = await res.json();
      const c = courses.find(x => x.id === id);
      if (c) openCourseModal(c);
    }

    async function saveCourse() {
      const days = [...document.querySelectorAll('.day-btn input:checked')].map(cb => cb.value).join('');
      const body = {
        name: document.getElementById('cName').value.trim(),
        instructor: document.getElementById('cInstructor').value.trim(),
        schedule: document.getElementById('cSchedule').value.trim(),
        days,
        start_time: document.getElementById('cStartTime').value,
        end_time: document.getElementById('cEndTime').value,
        capacity: parseInt(document.getElementById('cCapacity').value),
        capacity_male: parseInt(document.getElementById('cCapacityMale').value) || 0,
        capacity_female: parseInt(document.getElementById('cCapacityFemale').value) || 0,
        description: document.getElementById('cDesc').value.trim()
      };
      const errEl = document.getElementById('courseModalError');
      errEl.style.display = 'none';

      const url = editingCourseId ? `/api/admin/courses/${editingCourseId}` : '/api/admin/courses';
      const method = editingCourseId ? 'PUT' : 'POST';
      const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();

      if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }
      closeModal('courseModal');
      showToast(editingCourseId ? '강좌가 수정되었습니다.' : '강좌가 추가되었습니다.', 'success');
      loadCourses();
    }

    async function deleteCourse(id, name) {
      if (!confirm(`"${name}" 강좌를 삭제하시겠습니까?\n신청 내역도 모두 삭제됩니다.`)) return;
      const res = await fetch(`/api/admin/courses/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('강좌가 삭제되었습니다.', 'success');
      loadCourses();
    }

    let allEnrollments = [];
    let currentGenderFilter = '전체';

    async function showEnrollments(courseId, courseName) {
      document.getElementById('enrollModalTitle').textContent = `"${courseName}" 수강 신청자`;
      document.getElementById('enrollList').innerHTML = '<p style="text-align:center;padding:1rem;color:var(--text-muted)">불러오는 중...</p>';
      currentGenderFilter = '전체';
      document.querySelectorAll('.gender-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.gender === '전체'));
      openModal('enrollModal');

      const res = await fetch(`/api/admin/courses/${courseId}/enrollments`);
      allEnrollments = await res.json();
      renderEnrollList();
    }

    function filterEnrollByGender(gender) {
      currentGenderFilter = gender;
      document.querySelectorAll('.gender-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.gender === gender));
      renderEnrollList();
    }

    function renderEnrollList() {
      const filtered = currentGenderFilter === '전체'
        ? allEnrollments
        : allEnrollments.filter(u => u.gender === currentGenderFilter);
      const el = document.getElementById('enrollList');
      document.getElementById('enrollFilterCount').textContent = `${filtered.length}명`;

      if (!filtered.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">👤</div><p>해당하는 수강 신청자가 없습니다.</p></div>';
        return;
      }
      el.innerHTML = `<div class="table-wrap"><table>
        <thead><tr><th>번호</th><th>이름</th><th>성별</th><th>신청일</th></tr></thead>
        <tbody>${filtered.map((u, i) => `<tr>
          <td>${i + 1}</td>
          <td><strong>${esc(u.name)}</strong></td>
          <td>${esc(u.gender || '-')}</td>
          <td>${fmtDate(u.enrolled_at)}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    }

    // ── Settings ─────────────────────────────────────────────────────────────
    async function loadSettings() {
      const res = await fetch('/api/settings/registration');
      const s = await res.json();
      document.getElementById('regEnabled').checked = s.enabled;
      const [startDate, startTime] = (s.start || 'T').split('T');
      const [endDate,   endTime]   = (s.end   || 'T').split('T');
      document.getElementById('regStartDate').value = startDate || '';
      document.getElementById('regStartTime').value = startTime || '';
      document.getElementById('regEndDate').value   = endDate   || '';
      document.getElementById('regEndTime').value   = endTime   || '';
      document.getElementById('settingsError').style.display = 'none';
      renderRegStatusBanner(s);
    }

    function renderRegStatusBanner(s) {
      const banner = document.getElementById('regStatusBanner');
      if (!s.enabled) {
        banner.style.display = 'none';
        return;
      }
      const now = new Date();
      const start = s.start ? new Date(s.start) : null;
      const end   = s.end   ? new Date(s.end)   : null;
      let msg, bg, color;
      if (start && now < start) {
        msg = `대기 중 · 시작: ${fmtDateTime(s.start)}`;
        bg = '#fef9c3'; color = '#854d0e';
      } else if (end && now > end) {
        msg = `신청 종료됨 · 종료: ${fmtDateTime(s.end)}`;
        bg = '#fee2e2'; color = '#991b1b';
      } else {
        msg = `신청 진행 중${end ? ` · 마감: ${fmtDateTime(s.end)}` : ''}`;
        bg = '#dcfce7'; color = '#166534';
      }
      banner.textContent = msg;
      banner.style.cssText = `display:block;padding:.75rem 1rem;border-radius:8px;margin-bottom:1.25rem;font-size:.95rem;font-weight:600;background:${bg};color:${color}`;
    }

    async function saveSettings() {
      const enabled   = document.getElementById('regEnabled').checked;
      const startDate = document.getElementById('regStartDate').value;
      const startTime = document.getElementById('regStartTime').value;
      const endDate   = document.getElementById('regEndDate').value;
      const endTime   = document.getElementById('regEndTime').value;
      const start = startDate ? `${startDate}T${startTime || '00:00'}` : '';
      const end   = endDate   ? `${endDate}T${endTime || '00:00'}`     : '';
      const errEl   = document.getElementById('settingsError');
      errEl.style.display = 'none';

      const res = await fetch('/api/admin/settings/registration', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled, start, end })
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }
      showToast('기간 설정이 저장되었습니다.', 'success');
      loadSettings();
    }

    // ── Users ─────────────────────────────────────────────────────────────────
    async function loadUsers() {
      const res = await fetch('/api/admin/users');
      const users = await res.json();
      document.getElementById('userCount').textContent = `전체 회원 ${users.length}명`;

      const el = document.getElementById('userTable');
      if (!users.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">👥</div><p>회원이 없습니다.</p></div>';
        return;
      }

      el.innerHTML = `<div class="table-wrap"><table>
        <thead><tr>
          <th style="width:10%">목장</th>
          <th style="width:13%">이름</th>
          <th style="width:8%">성별</th>
          <th style="width:10%">역할</th>
          <th style="width:10%">수강 신청</th>
          <th style="width:13%">가입일</th>
          <th style="width:36%">관리</th>
        </tr></thead>
        <tbody>${users.map(u => `<tr>
          <td><strong style="font-size:1rem">${esc(u.ranch || '-')}</strong></td>
          <td style="font-size:1rem;font-weight:600">${esc(u.name)}</td>
          <td style="font-size:1rem">${esc(u.gender || '-')}</td>
          <td><span class="tag ${u.role === 'admin' ? 'tag-admin' : 'tag-user'}">${u.role === 'admin' ? '관리자' : '학생'}</span></td>
          <td style="font-size:1rem">${u.enrollment_count}개</td>
          <td style="font-size:.9rem;color:var(--text-muted)">${fmtDate(u.created_at)}</td>
          <td>
            <div class="flex gap-2">
              <select class="js-change-role" data-id="${u.id}" style="font-size:.85rem;padding:.35rem .6rem">
                <option value="user" ${u.role === 'user' ? 'selected' : ''}>학생</option>
                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>관리자</option>
              </select>
              <button class="btn btn-danger btn-sm js-delete-user" data-id="${u.id}" data-name="${esc(u.name)}">삭제</button>
            </div>
          </td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    }

    async function changeRole(id, role) {
      const res = await fetch(`/api/admin/users/${id}/role`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); loadUsers(); return; }
      showToast('역할이 변경되었습니다.', 'success');
    }

    async function deleteUser(id, name) {
      if (!confirm(`"${name}" 계정을 삭제하시겠습니까?\n모든 수강 신청 내역도 삭제됩니다.`)) return;
      const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('계정이 삭제되었습니다.', 'success');
      loadUsers();
    }

    // ── Drag & Drop ───────────────────────────────────────────────────────────
    let dragSrcRow = null;

    function attachDragHandlers(grid) {
      grid.querySelectorAll('.admin-course-card').forEach(card => {
        card.addEventListener('dragstart', e => {
          dragSrcRow = card;
          e.dataTransfer.effectAllowed = 'move';
          setTimeout(() => card.classList.add('dragging'), 0);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          grid.querySelectorAll('.admin-course-card').forEach(c => c.classList.remove('drag-over'));
          dragSrcRow = null;
        });

        card.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (dragSrcRow && dragSrcRow !== card) {
            grid.querySelectorAll('.admin-course-card').forEach(c => c.classList.remove('drag-over'));
            card.classList.add('drag-over');
          }
        });

        card.addEventListener('dragleave', e => {
          if (!card.contains(e.relatedTarget)) card.classList.remove('drag-over');
        });

        card.addEventListener('drop', e => {
          e.preventDefault();
          e.stopPropagation();
          if (!dragSrcRow || dragSrcRow === card) return;
          card.classList.remove('drag-over');

          const cards = [...grid.querySelectorAll('.admin-course-card')];
          const srcIdx = cards.indexOf(dragSrcRow);
          const dstIdx = cards.indexOf(card);
          if (srcIdx < dstIdx) {
            grid.insertBefore(dragSrcRow, card.nextSibling);
          } else {
            grid.insertBefore(dragSrcRow, card);
          }

          const ids = [...grid.querySelectorAll('.admin-course-card')].map(c => c.dataset.id);
          saveOrder(ids);
        });
      });
    }

    async function saveOrder(ids) {
      const res = await fetch('/api/admin/courses/reorder', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids })
      });
      if (!res.ok) showToast('순서 저장에 실패했습니다.', 'error');
    }

    // ── Utilities ─────────────────────────────────────────────────────────────
    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function esc(str) {
      return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function fmtDate(d) { return d ? new Date(d).toLocaleDateString('ko-KR') : '-'; }
    function fmtDateTime(d) {
      if (!d) return '-';
      return new Date(d).toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12: false });
    }
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show' + (type ? ' ' + type : '');
      setTimeout(() => t.className = 'toast', 2500);
    }
    async function logout() { await fetch('/api/logout', { method: 'POST' }); window.location.href = '/'; }

    // Close modal on backdrop click
    document.querySelectorAll('.modal-overlay').forEach(el =>
      el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); })
    );

    // Delegated event listeners — avoids inline onclick with user data
    document.addEventListener('click', e => {
      const btn = e.target.closest('button, select');
      if (!btn) return;

      if (btn.classList.contains('js-show-enrollments')) {
        showEnrollments(btn.dataset.id, btn.dataset.name);
      } else if (btn.classList.contains('js-edit-course')) {
        editCourse(Number(btn.dataset.id));
      } else if (btn.classList.contains('js-delete-course')) {
        deleteCourse(btn.dataset.id, btn.dataset.name);
      } else if (btn.classList.contains('js-delete-user')) {
        deleteUser(btn.dataset.id, btn.dataset.name);
      }
    });

    document.addEventListener('change', e => {
      const sel = e.target.closest('select.js-change-role');
      if (sel) changeRole(sel.dataset.id, sel.value);
    });

    init();
  </script>
</body>
</html>
